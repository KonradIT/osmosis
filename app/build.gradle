plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing — reads keystore.properties (created by CI from repo secrets). When it is absent
// — a plain source checkout, or a downstream packager such as F-Droid that signs with its own key —
// no signingConfig is attached at all and assembleRelease emits app-release-unsigned.apk. Attaching
// an empty signingConfig instead fails packageRelease with "missing required property storeFile".
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'dev.konraditurbe.osmosis'
    compileSdk 34

    defaultConfig {
        applicationId "dev.konraditurbe.osmosis"
        minSdk 29
        targetSdk 34
        // 21, not 20: testers are holding 1.3.3-action1-playback at versionCode 20, so anything
        // at or below that would never offer them an upgrade.
        versionCode 22
        versionName "1.3.1"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])   // resolves relative to app/ → repo root
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // AGP otherwise stuffs a Google-signed blob of the dependency list into the APK signing block.
    // It is opaque, it is not reproducible, and nothing here needs it. Requested by F-Droid review.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    testImplementation 'junit:junit:4.13.2'
}
